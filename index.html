<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#347864"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>買い物メモ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f5;color:#202923;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:640px;margin:auto;padding:20px 16px 120px}header{display:flex;align-items:center;gap:8px}h1{font-size:25px;margin:0 auto 12px 0}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:10px 12px;background:#e8eeea;color:#234739;cursor:pointer}button.primary{background:#347864;color:white}nav{display:flex;gap:8px;overflow:auto;padding:8px 0 16px}nav button{white-space:nowrap}article{background:white;border-radius:13px;margin-bottom:8px;padding:14px 12px}.line{display:flex;align-items:center;gap:12px}.line input{width:24px;height:24px;accent-color:#347864;flex:none}.item{flex:1;min-width:0;cursor:pointer}.name{font-weight:650;overflow-wrap:anywhere}.price{text-align:right;font-size:22px;font-weight:650}.small{font-size:12px;color:#69746e;margin-top:4px}.best{color:#347864}.done .name{text-decoration:line-through;color:#78817b}.details{border-top:1px solid #e5e9e6;margin-top:12px;padding-top:10px}.detailrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:12px 16px calc(12px + env(safe-area-inset-bottom));}footer>div{max-width:608px;margin:auto;display:flex;align-items:center;gap:12px}footer button{flex:1}dialog{border:none;border-radius:18px;width:min(92%,460px);max-height:85dvh;padding:20px;color:inherit}dialog::backdrop{background:#0006}label{display:block;margin:12px 0}label input{display:block;width:100%;padding:12px;border:1px solid #cbd4ce;border-radius:8px;margin-top:5px}h2{font-size:20px;margin-top:0}.empty{text-align:center;color:#69746e;padding:40px 10px}.danger{color:#a33}#notice{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#263b30;color:white;padding:10px;border-radius:8px;z-index:5;display:none}.offers{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.offer{flex:1;border:2px solid transparent;min-width:120px;text-align:left}.offer.selected{border-color:#347864}.offer.best{background:#e0f3e8}.badge{font-size:12px;font-weight:bold;display:block;margin-top:4px}.done{background:#e8ebe8}.done .offers{opacity:.5}.done .price{color:#78817b}.date-tools{display:flex;gap:8px;margin:0 0 14px;align-items:center}.offer small{display:block;color:#69746e;margin-top:4px}button,input,select{min-height:44px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b76a00;outline-offset:2px}.offers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.offer{min-width:0;overflow-wrap:anywhere}.offer.selected{box-shadow:0 0 0 1px #347864}.offer:disabled{opacity:1;cursor:default}.done .name{color:#59645d}.done .offers{opacity:.65}.badge{min-height:30px}.date-tools{justify-content:space-between;flex-wrap:wrap}.shop-actions{display:flex;gap:4px;flex-shrink:0}.detailrow{align-items:center;overflow-wrap:anywhere}dialog{overflow:auto}nav{position:sticky;top:0;background:#f6f7f5;z-index:1}header{flex-wrap:wrap}footer .small{max-width:46%;font-size:13px}#total{color:#39483e}label select{margin-top:5px}@media(max-width:380px){main{padding:16px 12px 120px}h1{font-size:23px}.offer{padding:10px 7px}.offer strong{font-size:19px!important}.shop-actions button{padding:8px}.detailrow{gap:6px}}@media(prefers-reduced-motion:no-preference){article{transition:background .15s}} </style></head><body><main><header><h1>買い物メモ</h1><button id="history">履歴</button><button id="settings">設定</button></header><nav id="tabs"></nav><div id="list"></div></main><footer><div><span id="total" class="small"></span><button id="add" class="primary">＋ 商品を追加</button></div></footer><dialog id="modal"></dialog><div id="notice"></div><script>
const $=s=>document.querySelector(s),key='shopping-memo-v1',uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s).normalize('NFKC').trim().toLowerCase().replace(/\s/g,''),yen=p=>p==null?'価格未登録':Number(p).toLocaleString()+'円';
let db;try{db=JSON.parse(localStorage.getItem(key))}catch{}db=db||{shops:[],items:[],history:[]};
if(!db.dailyMemos){try{if(localStorage.getItem(key))localStorage.setItem('shopping-memo-before-dates',localStorage.getItem(key))}catch{alert('更新前データの控えを保存できませんでした。設定からバックアップしてください。')}const map=new Map();for(const i of db.items){const n=norm(i.name);if(!map.has(n))map.set(n,{id:uid(),name:i.name,date:today(),shop:i.shop,done:false});const m=map.get(n);if(i.done){m.done=true;m.shop=i.shop;m.purchaseId=i.purchaseId}}db.dailyMemos=[...map.values()];db.memoDates=[today()]}
db.memoDates=db.memoDates||[...new Set(db.dailyMemos.map(x=>x.date))];if(!db.memoDates.length)db.memoDates=[today()];let active=db.memoDates.includes(today())?today():db.memoDates[0]||today();
function save(){try{localStorage.setItem(key,JSON.stringify(db))}catch{alert('保存できませんでした。バックアップを取ってください。')}render()}
function offers(name){return db.shops.map(s=>{const a=db.items.filter(i=>i.shop===s.id&&norm(i.name)===norm(name)).sort((a,b)=>b.date.localeCompare(a.date)||db.items.indexOf(b)-db.items.indexOf(a));return {shop:s.id,name:s.name,price:a[0]?.price??null,date:a[0]?.date||''}})}
function selected(m){return offers(m.name).find(o=>o.shop===m.shop)}
function render(){const items=db.dailyMemos.filter(m=>m.date===active);$('#tabs').innerHTML=[...db.memoDates].sort().map(d=>'<button data-day="'+esc(d)+'" class="'+(d===active?'primary':'')+'">'+esc(d.slice(5).replace('-','/'))+'</button>').join('')+'<button id="newday">＋ 日付</button>';$('#list').innerHTML='<div class="date-tools"><strong>'+esc(active)+' の買い物</strong>'+(items.length&&items.every(m=>m.done)?'<button id="deleteday" class="danger">この日のメモを削除</button>':'')+'</div>'+ (items.map(m=>{const os=offers(m.name),prices=os.filter(o=>o.price!=null).map(o=>o.price),min=prices.length?Math.min(...prices):null,h=db.history.filter(h=>norm(h.name)===norm(m.name)).sort((a,b)=>b.date.localeCompare(a.date)||b.time-a.time),chosen=selected(m);return '<article class="'+(m.done?'done':'')+'"><div class="line"><input type="checkbox" data-check="'+esc(m.id)+'" aria-label="'+esc(m.name)+'を購入済みにする" '+(m.done?'checked':'')+'><div class="item"><div class="name">'+esc(m.name)+(m.done?' ✓ 購入済み':'')+'</div><div class="small">前回購入：'+(h[0]?esc(h[0].date)+' · '+esc(h[0].shopName):'なし')+'</div></div><button data-edit="'+esc(m.id)+'" '+(m.done?'disabled':'')+'>編集</button></div><div class="offers">'+os.map(o=>'<button class="offer '+(o.shop===m.shop?'selected ':'')+(o.price!=null&&o.price===min?'best':'')+'" data-choose="'+esc(m.id)+'" data-shop="'+esc(o.shop)+'" '+(m.done?'disabled':'')+'>'+esc(o.name)+'<strong style="display:block;font-size:21px">'+yen(o.price)+'</strong><small>'+(o.date?'価格記録 '+esc(o.date):'価格を登録できます')+'</small><span class="badge">'+(o.shop===m.shop?'✓ 購入先 ':'')+(o.price!=null&&o.price===min&&prices.length>1?'最安値':'')+'</span></button>').join('')+'</div>'+(!os.length?'<div class="small">設定で店舗を追加してください</div>':'')+'<div class="small">購入先：'+esc(chosen?.name||'未選択')+'</div></article>'}).join('')||'<div class="empty">この日の商品を追加しましょう</div>');$('#total').textContent='未購入 '+items.filter(m=>!m.done).length+'点 · '+yen(items.filter(m=>!m.done).reduce((s,m)=>s+(selected(m)?.price||0),0));$('#add').disabled=false}
function modal(s){$('#modal').innerHTML=s;$('#modal').showModal()}function close(){$('#modal').close()}
function edit(m){if(!db.shops.length){alert('まず設定から店舗を追加してください');settings();return}modal('<form id="form"><h2>'+(m?'商品を編集':'商品を追加')+'</h2><label>商品名<input name="name" required maxlength="100" list="names" value="'+esc(m?.name||'')+'"><datalist id="names">'+[...new Set(db.items.map(i=>i.name))].map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist></label><label>買い物予定日<input name="day" type="date" required value="'+esc(m?.date||active)+'"></label><label>価格を登録する店舗<select name="shop" style="display:block;width:100%;padding:10px">'+db.shops.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===m?.shop?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></label><label>価格（円・空欄可）<input name="price" type="number" min="0" step="1" inputmode="numeric"></label><label>価格記録日<input name="recorded" type="date" required value="'+today()+'"></label><div id="compare" class="small"></div><div class="actions"><button type="button" data-close>取消</button><button class="primary">保存</button></div></form>');const f=$('#form'),field=n=>f.elements.namedItem(n);let dirty=false;const update=()=>{const os=offers(field('name').value),o=os.find(o=>o.shop===field('shop').value);field('price').value=o?.price??'';field('recorded').value=o?.date||today();$('#compare').textContent=os.map(o=>o.name+'：'+yen(o.price)+(o.date?'（'+o.date+'）':'')).join(' ／ ');dirty=false};field('name').oninput=update;field('shop').onchange=update;field('price').oninput=()=>{dirty=true;field('recorded').value=today()};update();f.onsubmit=e=>{e.preventDefault();if(m?.done)return alert('購入済みの商品は、チェックを外してから編集してください');const name=field('name').value.trim(),day=field('day').value,shop=field('shop').value;if(!name)return;if(db.dailyMemos.some(x=>x!==m&&x.date===day&&norm(x.name)===norm(name)))return alert('この日に同じ商品が登録済みです');const v={name,date:day,shop};if(m)Object.assign(m,v);else db.dailyMemos.push({...v,id:uid(),done:false});if(!db.memoDates.includes(day))db.memoDates.push(day);const price=field('price').value===''?null:Number(field('price').value),recorded=field('recorded').value,existing=db.items.filter(i=>i.shop===shop&&norm(i.name)===norm(name)).sort((a,b)=>b.date.localeCompare(a.date)||db.items.indexOf(b)-db.items.indexOf(a))[0];if(dirty||!existing||existing.date!==recorded||existing.price!==price)db.items.push({id:uid(),name,shop,price,date:recorded,done:false});active=day;close();save()}}
function history(){modal('<h2>購入履歴</h2>'+([...db.history].sort((a,b)=>b.date.localeCompare(a.date)||b.time-a.time).map(h=>'<div class="detailrow"><span>'+esc(h.name)+'<div class="small">'+esc(h.date)+' · '+esc(h.shopName)+'</div></span><span>'+yen(h.price)+' <button data-undo="'+esc(h.id)+'">取消</button></span></div>').join('')||'購入履歴はありません')+'<button data-close>閉じる</button>')}
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s))&&new Date(s).toISOString().slice(0,10)===s}
function validate(v){const str=x=>typeof x==='string',price=x=>x===null||(Number.isFinite(x)&&x>=0);if(!v||!['shops','items','history'].every(k=>Array.isArray(v[k]))||!v.shops.every(s=>str(s.id)&&str(s.name))||!v.items.every(i=>str(i.id)&&str(i.name)&&str(i.shop)&&validDate(i.date)&&price(i.price))||!v.history.every(h=>str(h.id)&&str(h.name)&&str(h.shopName)&&validDate(h.date)&&price(h.price)))throw Error();if(v.dailyMemos!==undefined&&(!Array.isArray(v.dailyMemos)||!v.dailyMemos.every(m=>str(m.id)&&str(m.name)&&validDate(m.date)&&str(m.shop)&&typeof m.done==='boolean')))throw Error();if(v.memoDates!==undefined&&(!Array.isArray(v.memoDates)||!v.memoDates.every(validDate)))throw Error();return v}
function settings(){modal('<h2>設定</h2><button id="reset">この日のチェックを一括解除</button><h3>店舗管理</h3>'+db.shops.map((s,j)=>'<div class="detailrow"><span>'+esc(s.name)+'</span><span class="shop-actions"><button data-move="'+esc(s.id)+'" '+(!j?'disabled':'')+' aria-label="店舗を上へ">↑</button><button data-rename="'+esc(s.id)+'">名称</button><button data-removeshop="'+esc(s.id)+'" class="danger">削除</button></span></div>').join('')+'<button id="newshop">＋ 店舗を追加</button><h3>データ管理</h3><div class="actions"><button id="export">バックアップ</button><button id="import">復元</button><input type="file" id="file" accept="application/json,.json" hidden></div><div class="actions"><button data-close>閉じる</button></div>');$('#file').onchange=async e=>{if(!e.target.files[0])return;try{const v=validate(JSON.parse(await e.target.files[0].text()));if(confirm('現在のデータをバックアップの内容で置き換えますか？')){localStorage.setItem('shopping-memo-before-restore',JSON.stringify(db));localStorage.setItem(key,JSON.stringify(v));location.reload()}}catch{alert('復元できませんでした。バックアップ形式と保存容量を確認してください。')}}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.undo){if(confirm('この購入履歴を取り消しますか？')){db.history=db.history.filter(h=>h.id!==d.undo);db.dailyMemos.forEach(m=>{if(m.purchaseId===d.undo){m.done=false;delete m.purchaseId}});save();close();history()}}else if(d.move){const j=db.shops.findIndex(s=>s.id===d.move);if(j>0){[db.shops[j-1],db.shops[j]]=[db.shops[j],db.shops[j-1]];save();close();settings()}}else if(d.rename){const s=db.shops.find(s=>s.id===d.rename),name=prompt('店舗名',s.name);if(name?.trim()){s.name=name.trim();save();close();settings()}}else if(d.removeshop){if(confirm('この店舗と店舗別価格を削除しますか？ 購入履歴と日付メモは残ります。未購入の購入先は選び直せます。')){db.shops=db.shops.filter(s=>s.id!==d.removeshop);db.items=db.items.filter(i=>i.shop!==d.removeshop);db.dailyMemos.filter(m=>!m.done&&m.shop===d.removeshop).forEach(m=>m.shop='');save();close();settings()}}else if(b.id==='import')$('#file').click();else if('close'in d)close();else if(d.day){active=d.day;render()}else if(d.edit)edit(db.dailyMemos.find(m=>m.id===d.edit));else if(d.choose){const m=db.dailyMemos.find(m=>m.id===d.choose);if(!m.done){m.shop=d.shop;save()}}else if(b.id==='add')edit();else if(b.id==='history')history();else if(b.id==='settings')settings();else if(b.id==='newday'){const day=prompt('買い物予定日（例：2026-11-18）',today());if(validDate(day)){if(!db.memoDates.includes(day))db.memoDates.push(day);active=day;save()}}else if(b.id==='deleteday'){const a=db.dailyMemos.filter(m=>m.date===active);if(a.length&&a.every(m=>m.done)&&confirm('この日のメモを削除しますか？ 購入履歴と店舗別価格は残ります。')){db.dailyMemos=db.dailyMemos.filter(m=>m.date!==active);db.memoDates=db.memoDates.filter(d=>d!==active);if(!db.memoDates.length)db.memoDates.push(today());active=db.memoDates[0];save()}}else if(b.id==='reset'){db.dailyMemos.filter(m=>m.date===active).forEach(m=>{m.done=false;delete m.purchaseId});close();save()}else if(b.id==='newshop'){const name=prompt('店舗名');if(name?.trim()){db.shops.push({id:uid(),name:name.trim()});save();close();settings()}}else if(b.id==='export'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='shopping-memo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});
document.addEventListener('change',e=>{if(!e.target.dataset.check)return;const m=db.dailyMemos.find(m=>m.id===e.target.dataset.check),o=selected(m);if(e.target.checked&&!o){e.target.checked=false;return alert('購入する店舗を選んでください')}m.done=e.target.checked;if(m.done){m.purchaseId=uid();db.history.push({id:m.purchaseId,name:m.name,shop:o.shop,shopName:o.name,price:o.price,date:today(),time:Date.now()})}else delete m.purchaseId;save()});render();


if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
