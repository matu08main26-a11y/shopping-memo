<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#347864"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>買い物メモ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f5;color:#202923;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:640px;margin:auto;padding:20px 16px 120px}header{display:flex;align-items:center;gap:8px}h1{font-size:25px;margin:0 auto 12px 0}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:10px 12px;background:#e8eeea;color:#234739;cursor:pointer}button.primary{background:#347864;color:white}nav{display:flex;gap:8px;overflow:auto;padding:8px 0 16px}nav button{white-space:nowrap}article{background:white;border-radius:13px;margin-bottom:8px;padding:14px 12px}.line{display:flex;align-items:center;gap:12px}.line input{width:24px;height:24px;accent-color:#347864;flex:none}.item{flex:1;min-width:0;cursor:pointer}.name{font-weight:650;overflow-wrap:anywhere}.price{text-align:right;font-size:22px;font-weight:650}.small{font-size:12px;color:#69746e;margin-top:4px}.best{color:#347864}.done .name{text-decoration:line-through;color:#78817b}.details{border-top:1px solid #e5e9e6;margin-top:12px;padding-top:10px}.detailrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:12px 16px calc(12px + env(safe-area-inset-bottom));}footer>div{max-width:608px;margin:auto;display:flex;align-items:center;gap:12px}footer button{flex:1}dialog{border:none;border-radius:18px;width:min(92%,460px);max-height:85dvh;padding:20px;color:inherit}dialog::backdrop{background:#0006}label{display:block;margin:12px 0}label input{display:block;width:100%;padding:12px;border:1px solid #cbd4ce;border-radius:8px;margin-top:5px}h2{font-size:20px;margin-top:0}.empty{text-align:center;color:#69746e;padding:40px 10px}.danger{color:#a33}#notice{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#263b30;color:white;padding:10px;border-radius:8px;z-index:5;display:none}</style></head><body><main><header><h1>買い物メモ</h1><button id="history">履歴</button><button id="settings">設定</button></header><nav id="tabs"></nav><div id="list"></div></main><footer><div><span id="total" class="small"></span><button id="add" class="primary">＋ 商品を追加</button></div></footer><dialog id="modal"></dialog><div id="notice"></div><script>
const $=s=>document.querySelector(s), key='shopping-memo-v1', uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2), today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let db;try{db=JSON.parse(localStorage.getItem(key))}catch{}if(!db)db={shops:[],items:[],history:[]};let active=db.shops[0]?.id,expanded=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), norm=s=>s.normalize('NFKC').trim().toLowerCase().replace(/\s/g,''), yen=p=>p==null?'—':Number(p).toLocaleString()+'円', shopname=id=>db.shops.find(s=>s.id===id)?.name||'削除済み店舗';function save(){try{localStorage.setItem(key,JSON.stringify(db))}catch{alert('保存できませんでした。バックアップを取ってください。')}render()}function recent(n){return db.history.filter(h=>norm(h.name)===norm(n)).sort((a,b)=>b.date.localeCompare(a.date)||b.time-a.time)}function render(){let items=db.items.filter(i=>i.shop===active);$('#tabs').innerHTML=db.shops.map(s=>`<button data-shop="${s.id}" class="${s.id===active?'primary':''}">${esc(s.name)}</button>`).join('')+'<button id="newshop">＋ 店舗</button>';$('#list').innerHTML=items.map(i=>{let matches=db.items.filter(x=>norm(x.name)===norm(i.name)&&x.price!=null).sort((a,b)=>a.price-b.price), h=recent(i.name), best=matches.length>1&&matches[0].price===i.price;return `<article class="${i.done?'done':''}"><div class="line"><input type="checkbox" aria-label="購入済み" data-check="${i.id}" ${i.done?'checked':''}><div class="item" data-expand="${i.id}"><div class="name">${esc(i.name)}</div><div class="small">前回購入：${h.length?esc(h[0].date)+' · '+esc(h[0].shopName):'なし'}</div></div><div class="price ${best?'best':''}" data-expand="${i.id}">${yen(i.price)}<div class="small">${esc(i.date)}</div></div><button data-expand="${i.id}" aria-label="詳細">${expanded===i.id?'⌃':'⌄'}</button></div>${expanded===i.id?`<div class="details"><div class="small">店舗別価格（記録時点）</div>${matches.map((x,j)=>`<div class="detailrow"><span>${esc(shopname(x.shop))}<div class="small">${esc(x.date)}</div></span><strong class="${x.price===matches[0].price?'best':''}">${yen(x.price)}</strong></div>`).join('')||'価格未登録'}<div class="small">最近の購入履歴</div>${h.slice(0,5).map(x=>`<div class="detailrow"><span>${esc(x.date)} ${esc(x.shopName)}</span><span>${yen(x.price)}</span></div>`).join('')||'なし'}<div class="actions"><button data-edit="${i.id}">編集</button><button data-delete="${i.id}" class="danger">削除</button></div></div>`:''}</article>`}).join('')||`<div class="empty">${active?'商品を追加しましょう':'まず店舗を追加しましょう'}</div>`;$('#total').textContent=`未購入 ${items.filter(i=>!i.done).length}点 · ${yen(items.filter(i=>!i.done).reduce((s,i)=>s+(i.price||0),0))}`;$('#add').disabled=!active}function modal(html){$('#modal').innerHTML=html;$('#modal').showModal()}function close(){ $('#modal').close()}function edit(i){let names=[...new Set(db.items.map(x=>x.name).concat(db.history.map(x=>x.name)))];modal(`<form id="itemform"><h2>${i?'商品を編集':'商品を追加'}</h2><label>商品名<input name="name" required maxlength="100" list="names" value="${esc(i?.name)}"><datalist id="names">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></label><label>価格（円・空欄可）<input name="price" type="number" min="0" step="1" inputmode="numeric" value="${i?.price??''}"></label><label>価格記録日<input name="date" type="date" required value="${i?.date||today()}"></label><div class="actions"><button type="button" data-close>取消</button><button class="primary">保存</button></div></form>`);let f=$('#itemform');f.price.addEventListener('input',()=>f.date.value=today());f.onsubmit=e=>{e.preventDefault();let name=f.name.value.trim();if(!name)return;let shop=i?.shop||active;if(db.items.some(x=>x.id!==i?.id&&x.shop===shop&&norm(x.name)===norm(name)))return alert('同じ商品が登録済みです');let v={name,shop,price:f.price.value===''?null:Number(f.price.value),date:f.date.value};if(i)Object.assign(i,v);else db.items.push({...v,id:uid(),done:false});close();save()}}function addshop(){modal('<form id="shopform"><h2>店舗を追加</h2><label>店舗名<input name="name" required maxlength="60"></label><button type="button" data-close>取消</button> <button class="primary">追加</button></form>');$('#shopform').onsubmit=e=>{e.preventDefault();let n=e.target.name.value.trim();if(!n)return;active=uid();db.shops.push({id:active,name:n});close();save()}}function history(){modal(`<h2>購入履歴</h2>${[...db.history].sort((a,b)=>b.date.localeCompare(a.date)||b.time-a.time).map(h=>`<div class="detailrow"><span>${esc(h.name)}<div class="small">${esc(h.date)} · ${esc(h.shopName)}</div></span><span>${yen(h.price)} <button data-undo="${h.id}">取消</button></span></div>`).join('')||'購入履歴はありません'}<div class="actions"><button data-close>閉じる</button></div>`)}function settings(){modal(`<h2>設定</h2><button id="reset">この店舗のチェックを一括解除</button><h3>店舗管理</h3>${db.shops.map((s,j)=>`<div class="detailrow"><span>${esc(s.name)}</span><span><button data-move="${s.id}" ${j===0?'disabled':''}>↑</button> <button data-rename="${s.id}">名称</button> <button data-removeshop="${s.id}">削除</button></span></div>`).join('')}<h3>データ管理</h3><div class="actions"><button id="export">バックアップ</button><button id="import">復元</button><input type="file" id="file" accept="application/json,.json" hidden></div><div class="actions"><button data-close>閉じる</button></div>`);$('#file').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!['shops','items','history'].every(k=>Array.isArray(v[k]))||!v.shops.every(x=>typeof x.id==='string'&&typeof x.name==='string')||!v.items.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&typeof x.date==='string'&&(x.price===null||Number.isFinite(x.price)))||!v.history.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&typeof x.date==='string'))throw Error();if(confirm('現在のデータを置き換えますか？')){db=v;active=db.shops[0]?.id;close();save()}}catch{alert('バックアップ形式が正しくありません')}}}document.addEventListener('click',e=>{let b=e.target.closest('button,[data-expand]');if(!b)return;let d=b.dataset,i=db.items.find(x=>x.id===(d.edit||d.delete));if(d.shop){active=d.shop;expanded=null;render()}else if(d.expand){expanded=expanded===d.expand?null:d.expand;render()}else if(d.edit)edit(i);else if(d.delete&&confirm('商品を削除しますか？ 購入履歴は残ります。')){db.items=db.items.filter(x=>x!==i);save()}else if('close'in d)close();else if(d.undo&&confirm('この購入履歴を取り消しますか？')){db.history=db.history.filter(h=>h.id!==d.undo);db.items.forEach(x=>{if(x.purchaseId===d.undo){x.done=false;delete x.purchaseId}});save();close();history()}else if(d.rename){let s=db.shops.find(x=>x.id===d.rename),n=prompt('店舗名',s.name);if(n?.trim()){s.name=n.trim();save();close();settings()}}else if(d.move){let j=db.shops.findIndex(x=>x.id===d.move);if(j>0){[db.shops[j-1],db.shops[j]]=[db.shops[j],db.shops[j-1]];save();close();settings()}}else if(d.removeshop&&confirm('店舗と商品を削除しますか？ 購入履歴は残ります。')){db.shops=db.shops.filter(x=>x.id!==d.removeshop);db.items=db.items.filter(x=>x.shop!==d.removeshop);if(active===d.removeshop)active=db.shops[0]?.id;save();close();settings()}else if(b.id==='newshop')addshop();else if(b.id==='add')edit();else if(b.id==='history')history();else if(b.id==='settings')settings();else if(b.id==='reset'){db.items.filter(x=>x.shop===active).forEach(x=>{x.done=false;delete x.purchaseId});close();save()}else if(b.id==='export'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='shopping-memo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}else if(b.id==='import')$('#file').click()});document.addEventListener('change',e=>{let id=e.target.dataset.check;if(!id)return;let i=db.items.find(x=>x.id===id);i.done=e.target.checked;if(i.done){i.purchaseId=uid();db.history.push({id:i.purchaseId,name:i.name,shop:i.shop,shopName:shopname(i.shop),price:i.price,date:today(),time:Date.now()})}else delete i.purchaseId;save()});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
