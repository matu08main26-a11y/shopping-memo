<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#355d4b"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>買い物メモ</title><style>*{box-sizing:border-box}
:root{color-scheme:light;--green:#28664f;--line:#d7e1d9}
body{margin:0;background:#f5f7f3;color:#202d24;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:680px;margin:auto;padding:20px 16px 140px;min-width:0}
header{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
h1{font-size:25px;margin:0 auto 10px 0;flex:1 0 100%}
h1 .small{font-size:12px;font-weight:400}
h2{font-size:21px;line-height:1.45;margin:0 0 18px;overflow-wrap:anywhere}
h2:focus{outline:none}
h3{font-size:17px;margin:24px 0 12px}
button,input,select{font:inherit;min-height:44px}
button,.link-button{border:0;border-radius:10px;padding:10px 12px;background:#e6eee7;color:#204d39;cursor:pointer;text-decoration:none;line-height:1.4}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--green);color:white}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #b57516;outline-offset:2px}
button.danger{color:#9e3434;background:#f9eeee}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 0 18px;position:sticky;top:0;background:#f5f7f3;z-index:1;max-width:100%}
nav button{white-space:nowrap;flex:none}
.date-tools{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.date-tools strong{font-size:16px}
article{background:#fff;border:1px solid #e4eae4;border-radius:15px;margin-bottom:12px;padding:16px 12px;min-width:0}
.line{display:flex;align-items:center;gap:10px}
.line input{width:26px;height:26px;min-height:26px;accent-color:var(--green);flex:none}
.item{flex:1;min-width:0}
.name{font-size:18px;font-weight:650;overflow-wrap:anywhere}
.small{font-size:12px;color:#5b6c60;line-height:1.65;margin-top:4px;overflow-wrap:anywhere}
.block{display:block}
.compare-label{margin-top:14px;font-weight:600}
.offers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.offers.single{grid-template-columns:minmax(0,1fr)}
.offer-wrap{min-width:0;display:flex;flex-direction:column}
.offer{width:100%;height:100%;text-align:left;overflow-wrap:anywhere;border:2px solid transparent;background:#f0f3f0}
.offer strong{display:block;font-size:23px;margin-top:6px}
.offer.selected{border-color:var(--green)}
.offer.best{background:#e3f3e7;color:#175235}
.badge{display:block;font-size:12px;font-weight:650;min-height:20px;margin-top:8px}
.offer-edit{width:100%;margin-top:4px;font-size:12px;background:transparent;text-decoration:underline}
.add-offer{margin-top:10px;background:transparent;color:var(--green);border:1px dashed #a1b9a7;width:100%;text-align:center}
.done{background:#e9ede8}
.done .name{text-decoration:line-through;color:#5b675d}
.done .offers{opacity:.65}
.done .offer:disabled{opacity:1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.actions button{flex:1}
.reorder-actions{justify-content:flex-end;margin-top:10px}
.reorder-actions button{flex:0 0 48px}
.reorder-actions span{margin-right:auto;color:#617566;font-size:13px}
.delete-day{margin-bottom:12px;width:100%}
.empty{text-align:center;color:#69746e;padding:40px 8px}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:2}
footer>div{max-width:648px;margin:auto;display:flex;align-items:center;gap:12px}
footer button{flex:1;white-space:nowrap}
#total{max-width:48%;font-size:13px;color:#394d3d}
dialog{border:none;border-radius:18px;width:calc(100% - 24px);max-width:480px;min-width:0;max-height:85dvh;max-height:85svh;padding:20px;color:inherit;overflow:auto;overscroll-behavior:contain}
dialog::backdrop{background:#11251c88}
form,label{min-width:0;max-width:100%}
label{display:block;margin:16px 0;font-size:14px;font-weight:600}
label input,label select{display:block;box-sizing:border-box;width:100%;max-width:100%;min-width:0;margin-top:7px;padding:12px;border:1px solid #b9c9bd;border-radius:9px;background:#fff;color:inherit;font-size:16px;font-weight:400}
input[type=date]{appearance:none;-webkit-appearance:none;min-height:48px}
input::-webkit-date-and-time-value{min-height:1.5em;text-align:left}
input[type=file][hidden]{display:none}
.suggestions{padding:4px 10px 10px;background:#f1f5ee;border:1px solid var(--line);border-radius:9px;margin-top:-8px}
.suggestions[hidden]{display:none}
.suggestions button{display:block;width:100%;text-align:left;background:transparent;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.detailrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e4eae3;overflow-wrap:anywhere}
.detailrow>span{min-width:0}
.detailrow>span:last-child{text-align:right}
.history-day,.presets{border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
summary{min-height:44px;cursor:pointer;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.shop-info{border-bottom:1px solid var(--line);padding:14px 0;overflow-wrap:anywhere}
.shop-info strong{display:block}
.link-button{display:inline-flex;align-items:center;min-height:44px;overflow-wrap:anywhere;font-size:14px}
.presets button{width:100%;text-align:left;margin-top:8px}
#offerlinks .link-button,#formlinks .link-button{width:100%;margin-top:8px}
@media(max-width:360px){main{padding:16px 12px 150px}dialog{padding:16px}.offer{padding:10px 8px}.offer strong{font-size:20px}header button{padding:10px}.name{font-size:17px}}
:root{--green:#355d4b;--line:#e0e6e1}
body{background:#f7f8f5;color:#27382d}
main{max-width:680px;padding-top:14px;padding-bottom:100px}
.compact-header{position:relative;display:flex;flex-wrap:nowrap;gap:12px;align-items:center;min-height:46px}

.list-tools{display:flex;justify-content:space-between;align-items:center;gap:4px;margin:0 0 8px;color:#728076;font-size:12px;flex-wrap:wrap}
.list-tools>div{display:flex;gap:4px}
.list-tools button{font-size:12px;padding:8px;background:transparent;color:#526858;min-height:44px}
.memo-row{padding:0;margin:0;border:0;border-bottom:1px solid #e4e9e2;border-radius:0;background:transparent;min-width:0}
.compact-row{display:flex;align-items:center;gap:0;min-height:64px}
.check-hit{margin:0;display:grid;place-items:center;flex:0 0 40px;min-width:40px;height:48px;cursor:pointer}

.row-toggle{display:flex;flex:1;gap:10px;align-items:center;text-align:left;background:transparent;padding:10px 0 10px 5px;min-width:0;color:inherit;border-radius:6px;min-height:64px}

.product-note{white-space:pre-wrap;overflow-wrap:anywhere;border-left:2px solid #b2b9a4;background:#f6f6ef;border-radius:0 6px 6px 0;padding:8px 10px;margin-top:10px;font-size:13px;line-height:1.6;color:#5a6053}

label textarea{display:block;box-sizing:border-box;width:100%;max-width:100%;min-width:0;margin-top:7px;padding:12px;border:1px solid #b9c9bd;border-radius:9px;background:#fff;color:inherit;font-size:16px;font-weight:400}
textarea:focus-visible{outline:3px solid #b57516;outline-offset:2px}

</style></head><body><main><header class="compact-header"><h1>買い物メモ<span class="version">一覧版 v8</span></h1><details id="appmenu" class="app-menu"><summary aria-label="履歴・店舗・設定メニュー">☰</summary><div class="menu-items"><button id="history">履歴</button><button id="flyers">店舗・チラシ</button><button id="settings">設定</button></div></details></header><nav id="tabs" aria-label="買い物予定日"></nav><div id="list"></div></main><footer><div><button id="add" class="primary">＋ 商品を追加</button></div></footer><dialog id="modal" aria-label="買い物メモの操作"></dialog><script>'use strict';
const $=s=>document.querySelector(s);
const key='shopping-memo-v1';
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFKC').trim().toLowerCase().replace(/\s/g,'');
const yen=p=>p==null?'価格未登録':Number(p).toLocaleString()+'円';
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s))&&new Date(s).toISOString().slice(0,10)===s;
const validPrice=p=>p===null||(Number.isFinite(p)&&p>=0);
function safeURL(s){try{const u=new URL(String(s||''));return ['http:','https:'].includes(u.protocol)&&!u.username&&!u.password?u.href:''}catch{return ''}}
const presets=[
 {name:'ライフ葛飾鎌倉店',address:'東京都葛飾区鎌倉1-14-7',url:'https://store.lifecorp.jp/detail/east808/'},
 {name:'サミットストア西小岩店',address:'',url:'https://www.summitstore.co.jp/store/tokyo/post/?id=215'}
];
function validate(v){
 const str=x=>typeof x==='string';
 if(!v||!['shops','items','history'].every(k=>Array.isArray(v[k])))throw Error('形式');
 if(!v.shops.every(s=>str(s.id)&&str(s.name)&&(s.url===undefined||!s.url||!!safeURL(s.url))&&(s.address===undefined||str(s.address))))throw Error('店舗');
 if(!v.items.every(i=>str(i.id)&&str(i.name)&&str(i.shop)&&validDate(i.date)&&validPrice(i.price)))throw Error('価格');
 if(!v.history.every(h=>str(h.id)&&str(h.name)&&str(h.shopName)&&validDate(h.date)&&validPrice(h.price)))throw Error('履歴');
 if(v.dailyMemos!==undefined&&(!Array.isArray(v.dailyMemos)||!v.dailyMemos.every(m=>str(m.id)&&str(m.name)&&validDate(m.date)&&str(m.shop)&&typeof m.done==='boolean'&&(m.note===undefined||typeof m.note==='string')&&(m.price===undefined||validPrice(m.price))&&(m.prices===undefined||(m.prices&&typeof m.prices==='object'&&!Array.isArray(m.prices)&&Object.values(m.prices).every(validPrice))))))throw Error('メモ');
 if(v.memoDates!==undefined&&(!Array.isArray(v.memoDates)||!v.memoDates.every(validDate)))throw Error('日付');
 return v;
}
let db,raw=null,loadError=false;
try{raw=localStorage.getItem(key);db=raw?validate(JSON.parse(raw)):null}catch{loadError=true}
db=db||{shops:[],items:[],history:[],dailyMemos:[],memoDates:[today()]};
// Old item records never populate prices on a new date memo.
if(!db.dailyMemos){
 try{localStorage.setItem('shopping-memo-before-dates',raw)}catch{}
 const map=new Map();
 for(const i of db.items){const k=norm(i.name);if(!map.has(k))map.set(k,{id:uid(),name:i.name,date:today(),shop:i.shop,done:false,prices:{}});if(i.done){const m=map.get(k);m.done=true;m.purchaseId=i.purchaseId}}
 db.dailyMemos=[...map.values()];db.memoDates=[today()];
}
db.memoDates=[...new Set([...(db.memoDates||[]),...db.dailyMemos.map(m=>m.date)])];
if(!db.memoDates.length)db.memoDates=[today()];
db.historyDays=90;
let active=db.memoDates.includes(today())?today():db.memoDates[0],reordering=false,historyLimit=30;
function pruneHistory(){
 const cutoff=new Date(today()+'T12:00:00');cutoff.setDate(cutoff.getDate()-90);
 const boundary=cutoff.getFullYear()+'-'+String(cutoff.getMonth()+1).padStart(2,'0')+'-'+String(cutoff.getDate()).padStart(2,'0');
 const before=db.history.length;db.history=db.history.filter(h=>h.date>=boundary);return before-db.history.length;
}
function persist(){try{if(loadError)throw Error();localStorage.setItem(key,JSON.stringify(db));return true}catch{alert(loadError?'保存データを読み込めなかったため、上書きを止めています。設定から元データを保存するか、バックアップを復元してください。':'保存できませんでした。設定からバックアップを保存してください。');return false}}
function save(){persist();render()}
function memoPrices(m){return m.prices&&typeof m.prices==='object'?m.prices:m.shop&&Number.isFinite(m.price)?{[m.shop]:m.price}:{}}
function memoOffers(m){const ps=memoPrices(m);return db.shops.filter(s=>Object.hasOwn(ps,s.id)).map(s=>({shop:s.id,name:s.name,price:ps[s.id],url:safeURL(s.url)}))}
function selected(m){const s=db.shops.find(s=>s.id===m.shop);return s?{shop:s.id,name:s.name,price:memoPrices(m)[s.id]??null}:undefined}
function modal(html){
 const dialog=$('#modal');if(dialog.open)dialog.close();
 dialog.innerHTML=html.replace('<h2>','<h2 tabindex="-1" autofocus>');dialog.showModal();
 // Focusing a heading avoids opening the mobile keyboard on dialog entry.
 dialog.querySelector('h2')?.focus({preventScroll:true});
}
function close(){$('#modal').close()}
function actions(label='保存'){return '<div class="actions"><button type="button" data-close>取消</button><button class="primary">'+label+'</button></div>'}
function shopOptions(chosen,shops=db.shops){return shops.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===chosen?'selected':'')+'>'+esc(s.name)+'</option>').join('')}
function pageLink(url,text){const u=safeURL(url);return u?'<a class="link-button" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(text)+'</a>':''}
let expanded=new Set();
function render(){
 const ms=db.dailyMemos.filter(m=>m.date===active);
 $('#tabs').innerHTML=[...db.memoDates].sort().map(d=>'<button data-day="'+esc(d)+'" class="'+(d===active?'primary':'')+'">'+esc(d.slice(5).replace('-','/'))+'</button>').join('')+'<button id="newday">＋ 日付</button>';
 const allOpen=ms.length>0&&ms.every(m=>expanded.has(m.id));
 $('#list').innerHTML='<div class="list-tools"><span>'+ms.filter(m=>!m.done).length+' / '+ms.length+' 点 未購入</span><div><button id="allfold" '+(!ms.length?'disabled':'')+'>'+(allOpen?'一覧に戻す':'すべて開く')+'</button><button id="reorder" aria-pressed="'+reordering+'">'+(reordering?'並び替え完了':'並び替え')+'</button></div></div>'+(reordering?'<p class="small">↑ ↓ で買い物する順に並べられます。</p>':'')+(ms.length&&ms.every(m=>m.done)?'<button id="deleteday" class="danger delete-day">この日のメモを削除</button>':'')+
 (ms.map((m,index)=>{
  const open=expanded.has(m.id),os=memoOffers(m),ps=os.filter(o=>o.price!==null).map(o=>o.price),min=ps.length?Math.min(...ps):null,chosen=selected(m);
  return '<article class="memo-row '+(m.done?'done ':'')+(open?'is-open':'')+'"><div class="compact-row"><label class="check-hit"><input type="checkbox" data-check="'+esc(m.id)+'" aria-label="'+esc(m.name)+'を購入済みにする" '+(m.done?'checked':'')+'></label><button class="row-toggle" data-expand="'+esc(m.id)+'" aria-expanded="'+open+'" aria-controls="detail-'+esc(m.id)+'"><span class="row-name">'+esc(m.name)+'</span><span class="row-price"><strong>'+yen(chosen?.price??null)+'</strong><span class="row-shop">'+esc(chosen?.name||'購入先未選択')+'</span>'+(!open&&m.note?'<span class="note-preview">'+esc(m.note)+'</span>':'')+'</span><span class="chevron" aria-hidden="true">'+(open?'⌃':'⌄')+'</span></button></div>'+
  (reordering?'<div class="actions reorder-actions"><span>'+(index+1)+'番目</span><button data-itemmove="'+esc(m.id)+'" data-step="-1" aria-label="'+esc(m.name)+'を上へ" '+(!index?'disabled':'')+'>↑</button><button data-itemmove="'+esc(m.id)+'" data-step="1" aria-label="'+esc(m.name)+'を下へ" '+(index===ms.length-1?'disabled':'')+'>↓</button></div>':'')+
  '<div id="detail-'+esc(m.id)+'" class="row-detail" '+(!open?'hidden':'')+'>'+
  (ps.length>1?'<div class="small compare-label">店舗の価格を比較</div>':'')+
  '<div class="offers '+(os.length===1?'single':'')+'">'+os.map(o=>'<div class="offer-wrap"><button class="offer '+(o.shop===m.shop?'selected ':'')+(ps.length>1&&o.price===min?'best':'')+'" data-choose="'+esc(m.id)+'" data-shop="'+esc(o.shop)+'" '+(m.done?'disabled':'')+'><span>'+esc(o.name)+'</span><strong>'+yen(o.price)+'</strong><span class="badge">'+(o.shop===m.shop?'✓ ':'')+(ps.length>1&&o.price===min?'最安値':'')+'</span></button>'+(!m.done?'<button class="offer-edit" data-offeredit="'+esc(m.id)+'" data-shop="'+esc(o.shop)+'">編集・削除</button>':'')+pageLink(o.url,'チラシ')+'</div>').join('')+'</div>'+
  (m.note?'<div class="product-note"><span class="small block">メモ</span>'+esc(m.note)+'</div>':'')+
  '<div class="detail-actions">'+(!m.done?'<button class="add-offer" data-offeradd="'+esc(m.id)+'">＋ 店舗の価格</button>':'')+'<button class="item-edit" data-edit="'+esc(m.id)+'">商品を編集</button></div></div></article>'
 }).join('')||'<div class="empty">この日の商品を追加しましょう</div>');
 $('#add').disabled=loadError;
}
function candidates(){const names=[...db.dailyMemos.map(m=>m.name),...db.history.slice().reverse().map(h=>h.name),...db.items.map(i=>i.name)],seen=new Set();return names.filter(n=>{const k=norm(n);if(!k||seen.has(k))return false;seen.add(k);return true})}
function attachSuggestions(input){
 const panel=$('#suggestions');let matches=[];
 const show=()=>{const q=norm(input.value);matches=candidates().filter(n=>!q||norm(n).includes(q)).slice(0,6);panel.innerHTML=matches.length?'<div class="small">過去の商品名（価格は引き継ぎません）</div>'+matches.map((n,i)=>'<button type="button" data-suggest="'+i+'">'+esc(n)+'</button>').join(''):'';panel.hidden=!matches.length};
 input.addEventListener('focus',show);input.addEventListener('input',show);
 input.addEventListener('keydown',e=>{if(e.key==='Escape'){panel.hidden=true;e.stopPropagation()}});
 panel.addEventListener('click',e=>{const b=e.target.closest('[data-suggest]');if(!b)return;input.value=matches[Number(b.dataset.suggest)];panel.hidden=true});
 $('#form').addEventListener('focusout',e=>{if(!$('#name-wrap').contains(e.relatedTarget))panel.hidden=true});
}
function edit(m){
 if(!db.shops.length){alert('まず店舗を追加しましょう');shopEdit();return}
 if(m?.done){modal('<form id="noteform"><h2>購入済みの商品</h2><p>'+esc(m.name)+'</p><label>商品メモ（任意）<textarea name="note" maxlength="1000" rows="3" placeholder="容量、個数、クーポン、代替品など">'+esc(m.note||'')+'</textarea></label><p class="small">商品メモは購入済みでも変更できます。価格などを変更する場合は、一覧のチェックを外してください。</p>'+actions('メモを保存')+'<div class="actions"><button type="button" class="danger" data-deletememo="'+esc(m.id)+'">この商品をメモから削除</button></div></form>');$('#noteform').onsubmit=e=>{e.preventDefault();m.note=$('#noteform').elements.namedItem('note').value.trim().slice(0,1000);close();save()};return}

 modal('<form id="form" autocomplete="off"><h2>'+(m?'商品を編集':'商品を追加')+'</h2><div id="name-wrap"><label>商品名<input name="name" required maxlength="100" autocomplete="off" value="'+esc(m?.name||'')+'"></label><div id="suggestions" class="suggestions" hidden></div></div><label>価格（円・空欄可）<input name="price" type="number" min="0" step="1" inputmode="numeric" placeholder="例：198" value="'+(m?selected(m)?.price??'':'')+'"></label><label>商品メモ（任意）<textarea name="note" maxlength="1000" rows="3" placeholder="容量、個数、クーポン、代替品など">'+esc(m?.note||'')+'</textarea></label><label>店舗<select name="shop" '+(m&&db.shops.some(s=>s.id===m.shop)?'disabled':'')+'>'+shopOptions(m?.shop)+'</select></label><div id="formlinks"></div>'+(m?'<p class="small">別店舗の追加は、商品カードの「＋ 店舗の価格」からできます。</p>':'')+'<label>買い物予定日<input name="day" type="date" required value="'+esc(m?.date||active)+'"></label>'+actions()+(m?'<div class="actions"><button type="button" class="danger" data-deletememo="'+esc(m.id)+'">この商品をメモから削除</button></div>':'')+'</form>');
 const f=$('#form'),field=n=>f.elements.namedItem(n);attachSuggestions(field('name'));
 const storeLinks=$('#formlinks');
 const updateStoreLink=()=>{storeLinks.innerHTML=pageLink(db.shops.find(s=>s.id===field('shop').value)?.url,'この店舗のチラシ・公式ページを開く')};field('shop').onchange=updateStoreLink;updateStoreLink();
 f.onsubmit=e=>{
  e.preventDefault();const name=field('name').value.trim(),day=field('day').value,shop=field('shop').value,price=field('price').value===''?null:Number(field('price').value);
  if(!name||!validDate(day)||!validPrice(price))return;
  if(!db.shops.some(s=>s.id===shop))return alert('店舗を選び直してください');
  if(db.dailyMemos.some(x=>x!==m&&x.date===day&&norm(x.name)===norm(name)))return alert('同じ商品があります。商品カードの「＋ 店舗の価格」から追加してください。');
  const prices={...(m?memoPrices(m):{}),[shop]:price},v={name,date:day,shop,price,prices,note:field('note').value.trim().slice(0,1000)};
  if(m)Object.assign(m,v);else db.dailyMemos.push({...v,id:uid(),done:false});
  if(!db.memoDates.includes(day))db.memoDates.push(day);active=day;close();save();
 };
}
function offerEdit(m,shop){
 if(!m||m.done)return;
 const ps=memoPrices(m),editing=shop!==undefined,available=editing?db.shops.filter(s=>s.id===shop):db.shops.filter(s=>!Object.hasOwn(ps,s.id));
 if(!available.length)return alert('登録済みの店舗はすべて追加されています。店舗カードの「価格の編集・削除」から変更できます。');
 modal('<form id="offerform" autocomplete="off"><h2>'+esc(m.name)+'：'+(editing?'店舗の価格を編集':'店舗の価格を追加')+'</h2><label>価格（円・空欄可）<input name="price" type="number" min="0" step="1" inputmode="numeric" placeholder="例：178" value="'+(editing?ps[shop]??'':'')+'"></label><label>店舗<select name="shop">'+shopOptions(shop,available)+'</select></label><div id="offerlinks"></div>'+actions(editing?'保存':'この商品に追加')+(editing?'<div class="actions"><button type="button" class="danger" data-offerremove="'+esc(m.id)+'" data-shop="'+esc(shop)+'">この店舗の価格だけ削除</button></div>':'')+'</form>');
 const f=$('#offerform'),field=n=>f.elements.namedItem(n);const links=()=>{$('#offerlinks').innerHTML=pageLink(db.shops.find(s=>s.id===field('shop').value)?.url,'この店舗のチラシ・公式ページを開く')};field('shop').onchange=links;links();
 f.onsubmit=e=>{e.preventDefault();const s=field('shop').value,p=field('price').value===''?null:Number(field('price').value);if(!available.some(x=>x.id===s)||!validPrice(p))return;m.prices={...memoPrices(m),[s]:p};if(!m.shop)m.shop=s;if(m.shop===s)m.price=p;close();save()};
}
function removeOffer(m,shop){
 if(!m||m.done||!Object.hasOwn(memoPrices(m),shop))return;
 if(!confirm('この商品から、この店舗の価格だけを削除しますか？ 他店舗の価格と購入履歴は残ります。'))return;
 const prices={...memoPrices(m)};delete prices[shop];m.prices=prices;if(m.shop===shop){m.shop=db.shops.find(s=>Object.hasOwn(prices,s.id))?.id||'';m.price=prices[m.shop]??null}close();save();
}
function moveMemo(id,step){
 const m=db.dailyMemos.find(m=>m.id===id);if(!m)return;const ms=db.dailyMemos.filter(x=>x.date===m.date),i=ms.indexOf(m),other=ms[i+step];if(!other)return;
 const a=db.dailyMemos.indexOf(m),b=db.dailyMemos.indexOf(other);[db.dailyMemos[a],db.dailyMemos[b]]=[db.dailyMemos[b],db.dailyMemos[a]];save();
}
function history(){
 pruneHistory();persist();
 const groups=new Map();for(const h of [...db.history].sort((a,b)=>b.date.localeCompare(a.date)||(b.time||0)-(a.time||0))){if(!groups.has(h.date))groups.set(h.date,[]);groups.get(h.date).push(h)}
 const dates=[...groups.keys()];
 modal('<h2>購入履歴</h2><p class="small">日付ごとに表示 · 保存期間は90日<br>90日を過ぎた履歴は、アプリを開いたときに自動削除します。</p>'+(dates.slice(0,historyLimit).map(date=>{const hs=groups.get(date);return '<details class="history-day"><summary>'+esc(date)+' · '+hs.length+'点 · '+yen(hs.reduce((s,h)=>s+(h.price||0),0))+'</summary>'+hs.map(h=>'<div class="detailrow"><span>'+esc(h.name)+'<span class="small block">'+esc(h.shopName)+'</span></span><span>'+yen(h.price)+' <button data-undo="'+esc(h.id)+'">取消</button></span></div>').join('')+'<button class="danger" data-historyday="'+esc(date)+'">この日の履歴を削除</button></details>'}).join('')||'<p>購入履歴はありません</p>')+(dates.length>historyLimit?'<button id="morehistory">以前の日付を表示</button>':'')+'<div class="actions"><button data-close>閉じる</button></div>');
}
function removeHistory(ids){const set=new Set(ids);db.history=db.history.filter(h=>!set.has(h.id));db.dailyMemos.forEach(m=>{if(set.has(m.purchaseId))delete m.purchaseId});save()}
function shopEdit(shop,preset){
 const initial=shop||preset||{name:'',address:'',url:''};
 modal('<form id="shopform" autocomplete="off"><h2>'+(shop?'店舗情報を編集':'店舗を追加')+'</h2><label>店舗名・支店名<input name="name" required maxlength="100" placeholder="例：ライフ 葛飾鎌倉店" value="'+esc(initial.name)+'"></label><label>住所・メモ（任意）<input name="address" maxlength="300" value="'+esc(initial.address||'')+'"></label><label>公式店舗・チラシURL（任意）<input name="url" type="url" inputmode="url" placeholder="https://…" value="'+esc(initial.url||'')+'"></label><p class="small">登録したページを別画面で開き、チラシを見ながら価格を入力できます。価格の自動取り込みは行いません。</p>'+actions(shop?'保存':'店舗を追加')+'</form>');
 const f=$('#shopform');f.onsubmit=e=>{e.preventDefault();const name=f.elements.namedItem('name').value.trim(),address=f.elements.namedItem('address').value.trim(),rawURL=f.elements.namedItem('url').value.trim(),url=safeURL(rawURL);if(!name)return;if(rawURL&&!url)return alert('http:// または https:// から始まるURLを入力してください');if(shop)Object.assign(shop,{name,address,url});else db.shops.push({id:uid(),name,address,url});close();save();settings()};
}
function shopLinks(){modal('<h2>店舗・チラシ</h2>'+db.shops.map(s=>'<section class="shop-info"><strong>'+esc(s.name)+'</strong><p class="small">'+esc(s.address||'')+'</p>'+pageLink(s.url,'チラシ・公式ページを開く')+(!safeURL(s.url)?'<p class="small">店舗情報でURLを登録できます</p>':'')+'<button data-shopedit="'+esc(s.id)+'">店舗情報</button></section>').join('')+'<button data-close>閉じる</button>')}
function settings(){
 modal('<h2>設定</h2><button id="reset">この日のチェックを一括解除</button><h3>店舗管理</h3>'+db.shops.map((s,j)=>'<section class="shop-info"><strong>'+esc(s.name)+'</strong><p class="small">'+esc(s.address||'')+'</p><div class="actions">'+pageLink(s.url,'チラシ・公式ページ')+'<button data-shopedit="'+esc(s.id)+'">店舗情報</button><button data-shopmove="'+esc(s.id)+'" '+(!j?'disabled':'')+' aria-label="店舗を上へ">↑</button><button data-removeshop="'+esc(s.id)+'" class="danger">削除</button></div></section>').join('')+'<button id="newshop">＋ 店舗を追加</button><details class="presets"><summary>指定の2店舗の情報を登録する</summary><p class="small">既存の店舗を選ぶと、店舗を増やさずに公式URLを登録できます。</p>'+presets.map((p,i)=>'<button data-preset="'+i+'">'+esc(p.name)+'</button>').join('')+'</details><h3>購入履歴</h3><p class="small">保存期間：90日。期限を過ぎた履歴はアプリ起動時に自動削除します。日付メモは削除しません。</p><h3>データ管理</h3>'+(loadError?'<button id="rawexport">読み込めなかった元データを保存</button>':'')+'<div class="actions"><button id="export">バックアップ</button><button id="import">復元</button><input type="file" id="file" accept="application/json,.json" hidden></div><div class="actions"><button data-close>閉じる</button></div>');
 $('#file').onchange=async e=>{if(!e.target.files[0])return;try{const v=validate(JSON.parse(await e.target.files[0].text()));if(!confirm('現在のデータを置き換えますか？ 復元した購入履歴も90日を過ぎた分は整理されます。'))return;localStorage.setItem('shopping-memo-before-restore',loadError?raw||'':JSON.stringify(db));localStorage.setItem(key,JSON.stringify(v));location.reload()}catch{alert('復元できませんでした。バックアップ形式と保存容量を確認してください。')}};
}
function presetEdit(index){const p=presets[index];if(!p)return;modal('<form id="presetform"><h2>'+esc(p.name)+'</h2><label>情報を登録する店舗<select name="target"><option value="">新しい店舗として追加</option>'+shopOptions('')+'</select></label><p class="small">既存の店舗を選ぶと、住所・URLを登録します。店舗名と価格は変更しません。</p>'+actions('次へ')+'</form>');const f=$('#presetform');f.onsubmit=e=>{e.preventDefault();const s=db.shops.find(s=>s.id===f.elements.namedItem('target').value);if(s)shopEdit(s,{...p});else shopEdit(null,p);if(s){const sf=$('#shopform');sf.elements.namedItem('url').value=p.url;if(!s.address)sf.elements.namedItem('address').value=p.address}}}
function download(content,name){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function newday(){modal('<form id="dayform"><h2>買い物の日付を追加</h2><label>買い物予定日<input name="day" type="date" required value="'+today()+'"></label>'+actions('追加')+'</form>');const f=$('#dayform');f.onsubmit=e=>{e.preventDefault();const day=f.elements.namedItem('day').value;if(!validDate(day))return;if(!db.memoDates.includes(day))db.memoDates.push(day);active=day;reordering=false;close();save()}}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;if(['history','flyers','settings'].includes(b.id)&&$('#appmenu'))$('#appmenu').open=false;const d=b.dataset,m=db.dailyMemos.find(m=>m.id===(d.edit||d.deletememo||d.offeradd||d.offeredit||d.offerremove||d.choose));
 if(d.expand){expanded.has(d.expand)?expanded.delete(d.expand):expanded.add(d.expand);render()}else if(b.id==='allfold'){const ms=db.dailyMemos.filter(m=>m.date===active),all=ms.every(m=>expanded.has(m.id));ms.forEach(m=>all?expanded.delete(m.id):expanded.add(m.id));render()}else if('close'in d)close();
 else if(d.day){active=d.day;reordering=false;render()}
 else if(d.edit)edit(m);
 else if(d.offeradd)offerEdit(m);
 else if(d.offeredit)offerEdit(m,d.shop);
 else if(d.offerremove)removeOffer(m,d.shop);
 else if(d.choose&&m&&!m.done){m.shop=d.shop;m.price=memoPrices(m)[d.shop]??null;save()}
 else if(d.itemmove)moveMemo(d.itemmove,Number(d.step));
 else if(d.deletememo&&m&&confirm('この商品をこの日のメモから削除しますか？ 購入履歴は残ります。')){db.dailyMemos=db.dailyMemos.filter(x=>x!==m);close();save()}
 else if(d.shopedit)shopEdit(db.shops.find(s=>s.id===d.shopedit));
 else if(d.preset!==undefined)presetEdit(Number(d.preset));
 else if(d.shopmove){const i=db.shops.findIndex(s=>s.id===d.shopmove);if(i>0){[db.shops[i-1],db.shops[i]]=[db.shops[i],db.shops[i-1]];save();settings()}}
 else if(d.removeshop&&confirm('店舗と各メモのこの店舗の価格を削除しますか？ 購入履歴と商品メモは残ります。')){db.shops=db.shops.filter(s=>s.id!==d.removeshop);db.items=db.items.filter(i=>i.shop!==d.removeshop);db.dailyMemos.forEach(m=>{const ps={...memoPrices(m)};delete ps[d.removeshop];m.prices=ps;if(m.shop===d.removeshop){m.shop=Object.keys(ps)[0]||'';m.price=ps[m.shop]??null}});save();settings()}
 else if(d.undo&&confirm('この購入履歴を取り消しますか？ 該当メモが残っている場合は未購入に戻します。')){db.dailyMemos.forEach(m=>{if(m.purchaseId===d.undo){m.done=false;delete m.purchaseId}});removeHistory([d.undo]);history()}
 else if(d.historyday&&confirm('この日の購入履歴を削除しますか？ 商品メモの購入済みチェックは変えません。')){removeHistory(db.history.filter(h=>h.date===d.historyday).map(h=>h.id));history()}
 else if(b.id==='add')edit();
 else if(b.id==='settings')settings();
 else if(b.id==='flyers')shopLinks();
 else if(b.id==='history'){historyLimit=30;history()}
 else if(b.id==='morehistory'){historyLimit+=30;history()}
 else if(b.id==='newshop')shopEdit();
 else if(b.id==='newday')newday();
 else if(b.id==='reorder'){reordering=!reordering;render()}
 else if(b.id==='deleteday'){const ms=db.dailyMemos.filter(m=>m.date===active);if(ms.length&&ms.every(m=>m.done)&&confirm('この日のメモを削除しますか？ 購入履歴は残ります。')){db.dailyMemos=db.dailyMemos.filter(m=>m.date!==active);db.memoDates=db.memoDates.filter(d=>d!==active);if(!db.memoDates.length)db.memoDates=[today()];active=db.memoDates[0];save()}}
 else if(b.id==='reset'){db.dailyMemos.filter(m=>m.date===active).forEach(m=>{m.done=false;delete m.purchaseId});close();save()}
 else if(b.id==='export')download(JSON.stringify(db),'shopping-memo-'+today()+'.json');
 else if(b.id==='rawexport')download(raw||'','shopping-memo-unreadable.json');
 else if(b.id==='import')$('#file').click();
});
document.addEventListener('change',e=>{
 const id=e.target.dataset.check;if(!id)return;const m=db.dailyMemos.find(m=>m.id===id);if(!m)return;const o=selected(m);
 if(e.target.checked&&!o){e.target.checked=false;alert('「＋ 店舗の価格」から購入先を追加してください');return}
 m.done=e.target.checked;if(m.done){m.purchaseId=uid();db.history.push({id:m.purchaseId,name:m.name,shop:o.shop,shopName:o.name,price:o.price,date:today(),time:Date.now()})}else delete m.purchaseId;save();
});
if(!loadError){pruneHistory();persist()}
render();
if(loadError)alert('保存データを読み込めませんでした。上書きせず保持しています。設定から元データを保存できます。');
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!loadError){pruneHistory();save()}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
