 modal('<form id="offerform" autocomplete="off"><h2>'+esc(m.name)+'：'+(editing?'店舗の価格を編集':'店舗の価格を追加')+'</h2><label>価格（円・空欄可）<input name="price" type="number" min="0" step="1" inputmode="numeric" placeholder="例：178" value="'+(editing?ps[shop]??'':'')+'"></label><label>店舗<select name="shop">'+shopOptions(shop,available)+'</select></label><div id="offerlinks"></div>'+actions(editing?'保存':'この商品に追加')+(editing?'<div class="actions"><button type="button" class="danger" data-offerremove="'+esc(m.id)+'" data-shop="'+esc(shop)+'">この店舗の価格だけ削除</button></div>':'')+'</form>');
 const f=$('#offerform'),field=n=>f.elements.namedItem(n);const links=()=>{$('#offerlinks').innerHTML=pageLink(db.shops.find(s=>s.id===field('shop').value)?.url,'この店舗のチラシ・公式ページを開く')};field('shop').onchange=links;links();
 f.onsubmit=e=>{e.preventDefault();const s=field('shop').value,p=field('price').value===''?null:Number(field('price').value);if(!available.some(x=>x.id===s)||!validPrice(p))return;m.prices={...memoPrices(m),[s]:p};if(!m.shop)m.shop=s;if(m.shop===s)m.price=p;close();save()};
}
function removeOffer(m,shop){
 if(!m||m.done||!Object.hasOwn(memoPrices(m),shop))return;
 if(!confirm('この商品から、この店舗の価格だけを削除しますか？ 他店舗の価格と購入履歴は残ります。'))return;
 const prices={...memoPrices(m)};delete prices[shop];m.prices=prices;if(m.shop===shop){m.shop=db.shops.find(s=>Object.hasOwn(prices,s.id))?.id||'';m.price=prices[m.shop]??null}close();save();
}
function history(){
 pruneHistory();persist();
 const groups=new Map();for(const h of [...db.history].sort((a,b)=>b.date.localeCompare(a.date)||(b.time||0)-(a.time||0))){if(!groups.has(h.date))groups.set(h.date,[]);groups.get(h.date).push(h)}
 const dates=[...groups.keys()];
 modal('<h2>購入履歴</h2><p class="small">日付ごとに表示 · 保存期間は90日<br>90日を過ぎた履歴は、アプリを開いたときに自動削除します。</p>'+(dates.slice(0,historyLimit).map(date=>{const hs=groups.get(date);return '<details class="history-day"><summary>'+esc(date)+' · '+hs.length+'点 · '+yen(hs.reduce((s,h)=>s+(h.price||0),0))+'</summary>'+hs.map(h=>'<div class="detailrow"><span>'+esc(h.name)+'<span class="small block">'+esc(h.shopName)+'</span></span><span>'+yen(h.price)+' <button data-undo="'+esc(h.id)+'">取消</button></span></div>').join('')+'<button class="danger" data-historyday="'+esc(date)+'">この日の履歴を削除</button></details>'}).join('')||'<p>購入履歴はありません</p>')+(dates.length>historyLimit?'<button id="morehistory">以前の日付を表示</button>':'')+'<div class="actions"><button data-close>閉じる</button></div>');
}
function removeHistory(ids){const set=new Set(ids);db.history=db.history.filter(h=>!set.has(h.id));db.dailyMemos.forEach(m=>{if(set.has(m.purchaseId))delete m.purchaseId});save()}
function shopEdit(shop,preset){
 const initial=shop||preset||{name:'',address:'',url:''};
 modal('<form id="shopform" autocomplete="off"><h2>'+(shop?'店舗情報を編集':'店舗を追加')+'</h2><label>店舗名・支店名<input name="name" required maxlength="100" placeholder="例：ライフ 葛飾鎌倉店" value="'+esc(initial.name)+'"></label><label>住所・メモ（任意）<input name="address" maxlength="300" value="'+esc(initial.address||'')+'"></label><label>公式店舗・チラシURL（任意）<input name="url" type="url" inputmode="url" placeholder="https://…" value="'+esc(initial.url||'')+'"></label><p class="small">登録したページを別画面で開き、チラシを見ながら価格を入力できます。価格の自動取り込みは行いません。</p>'+actions(shop?'保存':'店舗を追加')+'</form>');
 const f=$('#shopform');f.onsubmit=e=>{e.preventDefault();const name=f.elements.namedItem('name').value.trim(),address=f.elements.namedItem('address').value.trim(),rawURL=f.elements.namedItem('url').value.trim(),url=safeURL(rawURL);if(!name)return;if(rawURL&&!url)return alert('http:// または https:// から始まるURLを入力してください');if(shop)Object.assign(shop,{name,address,url});else db.shops.push({id:uid(),name,address,url});close();save();storesView()};
}
function presetEdit(index){const p=presets[index];if(!p)return;modal('<form id="presetform"><h2>'+esc(p.name)+'</h2><label>情報を登録する店舗<select name="target"><option value="">新しい店舗として追加</option>'+shopOptions('')+'</select></label><p class="small">既存の店舗を選ぶと、住所・URLを登録します。店舗名と価格は変更しません。</p>'+actions('次へ')+'</form>');const f=$('#presetform');f.onsubmit=e=>{e.preventDefault();const s=db.shops.find(s=>s.id===f.elements.namedItem('target').value);if(s)shopEdit(s,{...p});else shopEdit(null,p);if(s){const sf=$('#shopform');sf.elements.namedItem('url').value=p.url;if(!s.address)sf.elements.namedItem('address').value=p.address}}}
function download(content,name){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function newday(){modal('<form id="dayform"><h2>買い物の日付を追加</h2><label>買い物予定日<input name="day" type="date" required value="'+today()+'"></label>'+actions('追加')+'</form>');const f=$('#dayform');f.onsubmit=e=>{e.preventDefault();const day=f.elements.namedItem('day').value;if(!validDate(day))return;if(!db.memoDates.includes(day))db.memoDates.push(day);active=day;storeFilter='all';close();save()}}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;if(['history','flyers','settings'].includes(b.id)&&$('#appmenu'))$('#appmenu').open=false;const d=b.dataset,m=db.dailyMemos.find(m=>m.id===(d.note||d.edit||d.deletememo||d.offeradd||d.offeredit||d.offerremove||d.choose));
 if(d.expand){expanded.has(d.expand)?expanded.delete(d.expand):expanded.add(d.expand);render()}else if(b.id==='allfold'){const ms=visibleItems(),all=ms.every(m=>expanded.has(m.id));ms.forEach(m=>all?expanded.delete(m.id):expanded.add(m.id));render()}else if('close'in d)close();
 else if(d.day){active=d.day;storeFilter='all';render()}
 else if('store'in d){storeFilter=d.store;render()}else if(d.note)noteEdit(m);else if(d.edit)otherEdit(m);
 else if(d.offeradd)offerEdit(m);
 else if(d.offeredit)offerEdit(m,d.shop);
 else if(d.offerremove)removeOffer(m,d.shop);
 else if(d.choose&&m&&!m.done){const old=m.shop;m.shop=d.shop;m.price=memoPrices(m)[d.shop]??null;save();if(storeFilter!=='all'&&old!==d.shop)toast('購入予定を'+(selected(m)?.name||'別店舗')+'へ変更しました')}
 
 else if(d.deletememo&&m&&confirm('この商品をこの日のメモから削除しますか？ 購入履歴は残ります。')){db.dailyMemos=db.dailyMemos.filter(x=>x!==m);close();save()}
 else if(d.shopdetail)storeDetail(db.shops.find(s=>s.id===d.shopdetail));else if(d.shopedit)shopEdit(db.shops.find(s=>s.id===d.shopedit));
 else if(d.preset!==undefined)presetEdit(Number(d.preset));
 else if(d.shopmove){const i=db.shops.findIndex(s=>s.id===d.shopmove),j=i+Number(d.step||-1);if(i>=0&&j>=0&&j<db.shops.length){[db.shops[i],db.shops[j]]=[db.shops[j],db.shops[i]];save();storesView()}}
 else if(d.removeshop&&confirm('店舗と各メモのこの店舗の価格を削除しますか？ 購入履歴と商品メモは残ります。')){db.shops=db.shops.filter(s=>s.id!==d.removeshop);db.items=db.items.filter(i=>i.shop!==d.removeshop);db.dailyMemos.forEach(m=>{if(m.done)return;const ps={...memoPrices(m)};delete ps[d.removeshop];m.prices=ps;if(m.shop===d.removeshop){m.shop=Object.keys(ps)[0]||'';m.price=ps[m.shop]??null}});save();storesView()}
 else if(d.undo&&confirm('この購入履歴を取り消しますか？ 該当メモが残っている場合は未購入に戻します。')){db.dailyMemos.forEach(m=>{if(m.purchaseId===d.undo){m.done=false;delete m.purchaseId;delete m.purchase}});removeHistory([d.undo]);history()}
 else if(d.historyday&&confirm('この日の購入履歴を削除しますか？ 商品メモの購入済みチェックは変えません。')){removeHistory(db.history.filter(h=>h.date===d.historyday).map(h=>h.id));history()}
 else if(b.id==='add')edit();
 else if(b.id==='settings')settings();
 else if(b.id==='flyers'||b.id==='storesback')storesView();else if(b.id==='settingshistory'){historyLimit=30;history()}
 else if(b.id==='history'){historyLimit=30;history()}
 else if(b.id==='morehistory'){historyLimit+=30;history()}
 else if(b.id==='newshop')shopEdit();
 else if(b.id==='newday')newday();
 
 else if(b.id==='deleteday'){const ms=db.dailyMemos.filter(m=>m.date===active);if(ms.length&&ms.every(m=>m.done)&&confirm('この日のメモを削除しますか？ 購入履歴は残ります。')){db.dailyMemos=db.dailyMemos.filter(m=>m.date!==active);db.memoDates=db.memoDates.filter(d=>d!==active);if(!db.memoDates.length)db.memoDates=[today()];active=db.memoDates[0];save()}}
 else if(b.id==='reset'){db.dailyMemos.filter(m=>m.date===active).forEach(uncheck);close();save()}
 else if(b.id==='export')download(JSON.stringify(db),'shopping-memo-'+today()+'.json');
 else if(b.id==='rawexport')download(raw||'','shopping-memo-unreadable.json');
 else if(b.id==='import')$('#file').click();
});
document.addEventListener('change',e=>{const id=e.target.dataset.check;if(!id)return;const m=db.dailyMemos.find(m=>m.id===id);if(!m)return;if(!setPurchased(m,e.target.checked)){e.target.checked=false;alert('購入する店舗を選んでください。商品を開いて「＋ 店舗」から追加できます。')}});
// Preserve historical purchase snapshots before the existing history-retention pass.
for(const m of db.dailyMemos){if(m.done&&!m.purchase){const h=db.history.find(h=>h.id===m.purchaseId);if(h)m.purchase={...h}}}
if(!loadError){pruneHistory();persist()}
render();
if(loadError)alert('保存データを読み込めませんでした。上書きせず保持しています。設定から元データを保存できます。');
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!loadError){pruneHistory();save()}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
